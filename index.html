<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELDA | طراحی و دوخت</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1eb;
      color: #252321;
      font-family: Tahoma, Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 30px 22px 28px;
      position: relative;
    }

    /* FRAME */

    .page::before {
      content: "";
      position: fixed;
      top: 15px;
      bottom: 15px;
      left: 15px;
      right: 15px;
      border: 1px solid #d9d2c7;
      pointer-events: none;
    }


    /* BRAND */

    .brand-area {
      text-align: center;
      padding-top: 40px;
      padding-bottom: 30px;
    }

    .brand {
      direction: ltr;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 64px;
      font-weight: 500;
      letter-spacing: 8px;
      line-height: 1;
      margin-left: 8px;
      color: #252321;
    }

    .brand-sub {
      margin-top: 15px;
      direction: ltr;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: #827a70;
    }

    .brand-line {
      width: 48px;
      height: 1px;
      background: #9b8d7d;
      margin: 21px auto 0;
    }


    /* INTRO */

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .intro-title {
      font-size: 19px;
      font-weight: 500;
      color: #292622;
      margin-bottom: 9px;
    }

    .intro-text {
      font-size: 14px;
      line-height: 2;
      color: #81786e;
    }

    .intro-categories {
      margin-top: 5px;
      font-size: 13px;
      color: #6f665d;
      letter-spacing: .1px;
    }


    /* BUTTONS */

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .action {
      width: 100%;
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      position: relative;

      padding: 12px 18px;

      text-decoration: none;
      color: #252321;

      background: #fcfaf6;

      border: 1px solid #d6cec3;
      border-radius: 9px;

      text-align: center;

      box-shadow:
        0 4px 10px rgba(72, 62, 50, 0.055),
        0 1px 2px rgba(72, 62, 50, 0.035);

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    /* ICON */

    .icon {
      width: 44px;
      height: 44px;
      min-width: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-left: 16px;

      border: 1px solid #c7bbae;
      border-radius: 50%;

      background: #f6f2ec;
    }

    .icon svg {
      width: 20px;
      height: 20px;

      fill: none;
      stroke: #5d544b;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* TEXT */

    .action-text {
      flex: 1;
      text-align: center;
      padding-right: 3px;
    }

    .action-title {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      color: #292622;
    }

    .action-desc {
      margin-top: 4px;
      font-size: 12px;
      color: #81786e;
      line-height: 1.6;
    }

    .action:hover {
      transform: translateY(-2px);

      border-color: #b6a99a;

      background: #ffffff;

      box-shadow:
        0 7px 16px rgba(72, 62, 50, 0.09),
        0 2px 4px rgba(72, 62, 50, 0.04);
    }


    /* ADDRESS */

    .address-box {
      margin-top: 29px;
      padding: 24px 18px;

      background: #ebe6de;

      border: 1px solid #ded7ce;

      text-align: center;
    }

    .address-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: .8px;
      color: #82786d;
      margin-bottom: 9px;
    }

    .address-title {
      font-size: 16px;
      font-weight: 500;
      color: #322e2a;
      margin-bottom: 10px;
    }

    .address {
      font-size: 14px;
      line-height: 2.15;
      color: #625a52;
    }


    /* SERVICES */

    .services {
      text-align: center;
      padding: 27px 5px 4px;
    }

    .services-title {
      font-size: 12px;
      color: #8b8176;
      margin-bottom: 12px;
    }

    .services-list {
      font-family: Georgia, "Times New Roman", serif;
      direction: rtl;
      font-size: 14px;
      color: #5d554d;
      line-height: 2.2;
    }


    /* FOOTER */

    .footer {
      text-align: center;
      padding-top: 33px;
      padding-bottom: 15px;
    }

    .footer-line {
      width: 28px;
      height: 1px;
      background: #bdb2a5;
      margin: 0 auto 14px;
    }

    .footer-brand {
      direction: ltr;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #81776d;
      margin-left: 4px;
    }

    .footer-copy {
      margin-top: 8px;
      font-size: 9px;
      color: #aaa197;
    }


    /* MOBILE */

      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .page::before {
        left: 10px;
        right: 10px;
      }

      .brand {
        font-size: 55px;
        letter-spacing: 7px;
      }

      .brand-sub {
        font-size: 9px;
