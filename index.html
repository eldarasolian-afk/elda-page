<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELDA | طراحی و دوخت</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f2ee;
      color: #202020;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 55px 25px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      direction: ltr;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 58px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-left: 8px;
      line-height: 1;
    }

    .brand-line {
      width: 48px;
      height: 1px;
      background: #222;
      margin: 22px auto 18px;
    }

    .tagline {
      font-size: 14px;
      font-weight: 300;
      color: #555;
      text-align: center;
      line-height: 2;
      margin-bottom: 38px;
    }

    .links {
      width: 100%;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin-bottom: 13px;
      padding: 15px 20px;
      text-decoration: none;
      color: #202020;
      background: #ffffff;
      border: 1px solid #dedbd5;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 400;
      transition: all .2s ease;
    }

    .link:hover {
      background: #ece9e3;
      transform: translateY(-1px);
    }

    .link-icon {
      direction: ltr;
      margin-left: 10px;
      font-size: 17px;
    }

    .address-box {
      width: 100%;
      margin-top: 25px;
      padding: 22px 20px;
      background: transparent;
      border-top: 1px solid #d5d1c9;
      border-bottom: 1px solid #d5d1c9;
      text-align: center;
    }

    .address-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .address {
      font-size: 13px;
      font-weight: 300;
      line-height: 2.1;
      color: #555;
    }

    .description {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      line-height: 2;
      color: #777;
    }

    .footer {
      margin-top: auto;
      padding-top: 45px;
      font-family: 'Playfair Display', Georgia, serif;
      direction: ltr;
      letter-spacing: 3px;
      font-size: 11px;
      color: #999;
    }

    @media (max-width: 380px) {
      .page {
        padding: 45px 18px 30px;
      }

      .brand {
        font-size: 50px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">ELDA</div>

    <div class="brand-line"></div>

    <div class="tagline">
      طراحی و دوخت<br>
      تولید و خدمات پوشاک
    </div>

    <section class="links">

      <a class="link" href="tel:09021905376">
        <span class="link-icon">☎</span>
        تماس با ELDA
      </a>

      <a class="link" href="https://ble.ir/ELDAwear" target="_blank">
        <span class="link-icon">✉</span>
        پیام در بله
      </a>

      <a class="link" href="https://nshn.ir/vbQIkqpx4phk" target="_blank">
        <span class="link-icon">⌖</span>
        مسیریابی فروشگاه
      </a>

    </section>

    <section class="address-box">

      <div class="address-title">
        آدرس فروشگاه
      </div>

      <div class="address">
        عبدل‌آباد؛ خیابان شکوفه؛ خیابان رحمان؛
        <br>
        بعد از کوچه بیست‌ونهم؛ پلاک ۳۸
      </div>

    </section>

    <div class="description">
      طراحی و دوخت سفارشی · تولید · خدمات پوشاک
    </div>

    <div class="footer">
      ELDA
    </div>

  </main>

</body>
</html>
